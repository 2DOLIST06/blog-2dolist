name: SEO Audit - Blog 2Dolist

on:
  workflow_dispatch:

env:
  API_BASE_URL: https://blog-2dolist-api.onrender.com
  FRONTEND_BASE_URL: https://blog-2dolist.vercel.app

jobs:
  seo-audit:
    name: Run SEO audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-2dolist-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: blog-2dolist-main/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Run complete SEO audit
        run: npm run seo:audit

      - name: Run targeted SEO verification
        run: >-
          npm run seo:verify --
          /2025/10/22/location-de-jet-prive-en-france-voyager-librement-vers-leurope/
          /2026/09/01/saut-en-parachute-paris-ou-sauter/
          /2026/09/07/vol-helicoptere-paris-ou-decoller-que-survoler/
          /category/aerien/parapente/
          /category/aerien/helicoptere/
